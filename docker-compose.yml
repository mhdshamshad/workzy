services:
  redis:
    image: redis:7-alpine
    container_name: workzy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: workzy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - CLIENT_URL=http://localhost
    depends_on:
      - redis
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: workzy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"