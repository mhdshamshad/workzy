
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      CLIENT_URL: https://workzynow.in
      SERVER_URL: https://workzynow.in
      GOOGLE_CALLBACK_URL: https://workzynow.in/api/auth/google/callback
    depends_on:
      - redis
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
